name: Publish Astro Observability

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require public API URL
        env:
          API_URL: ${{ vars.OBSERVABILITY_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Configure a repository variable OBSERVABILITY_API_URL with the backend HTTPS URL."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build site
        env:
          VITE_API_BASE_URL: ${{ vars.OBSERVABILITY_API_URL }}
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
